server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Version banner is free information for an attacker.
    server_tokens off;

    # The SPA holds no secrets, but its shell must never be cached on a kiosk:
    # a stale bundle would keep serving an old idle timeout after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    # Hashed build assets are immutable by construction.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routing: every unknown path renders the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers. connect-src is intentionally 'self' plus the API origin
    # only - substitute the real API host at deploy time.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:4000; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Uploaded citizen documents are never served by this container; there is no
    # location block pointing at any upload directory, by design.
}
