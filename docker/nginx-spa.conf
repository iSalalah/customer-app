server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Version banner is free information for an attacker.
    server_tokens off;

    # Security headers are `include`d into EVERY location rather than set once
    # here, because nginx drops inherited `add_header` directives in any block
    # that defines one of its own - silently. See the comment in the snippet.
    include /etc/nginx/snippets/security-headers.conf;

    # The SPA holds no secrets, but its shell must never be cached on a kiosk:
    # a stale bundle would keep serving an old idle timeout after a redeploy.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    # Hashed build assets are immutable by construction.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routing: every unknown path renders the app shell.
    # `try_files` falls through to /index.html as an internal redirect, which
    # re-enters location matching and lands in the exact-match block above.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Uploaded citizen documents are never served by this container; there is no
    # location block pointing at any upload directory, by design.
}
