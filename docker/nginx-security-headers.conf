# ترويسات الأمان المشتركة.
#
# تعيش في ملف منفصل لسبب جوهري في nginx: توجيه `add_header` **لا يُورَّث**
# إلى أي `location` يعرّف `add_header` خاصًا به. وبما أن كتلتَي
# `= /index.html` و`/assets/` تعرّفان `Cache-Control`، فإن أي ترويسة أمان
# مكتوبة على مستوى `server` وحده تختفي منهما بصمت — بلا خطأ ولا تحذير.
#
# لذلك يُستدعى هذا الملف بـ`include` داخل كل كتلة، لا مرة واحدة في الأعلى.
#
# ملاحظة على `connect-src`: يجب أن يحوي أصل الواجهة الخلفية الحقيقي عند
# النشر. القيمة أدناه للتطوير المحلي فقط.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:4000; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
